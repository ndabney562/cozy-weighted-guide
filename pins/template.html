<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1000px;height:1500px;overflow:hidden;background:#28365f}
.ph{position:absolute;inset:0 0 560px 0;background-size:cover;background-position:center}
.panel{position:absolute;left:0;right:0;bottom:0;height:560px;background:#28365f;color:#fff;padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column}
.kick{font:600 26px/1 "Instrument Sans";letter-spacing:.14em;text-transform:uppercase;color:#f6e1dc}
h1{font:400 92px/1.02 "Instrument Serif";margin:26px 0 0}
p{font:400 32px/1.35 "Instrument Sans";margin:26px 0 0;color:#dfe2e7}
.foot{margin-top:auto;font:600 26px/1 "Instrument Sans";color:#f6e1dc;letter-spacing:.06em}
</style></head><body>
<div class="ph" id="ph"></div>
<div class="panel"><div class="kick" id="k"></div><h1 id="h"></h1><p id="p"></p><div class="foot">HEAVY HUGS · GIFT GUIDE 2026</div></div>
<script>
const q=new URLSearchParams(location.search);
ph.style.backgroundImage=`url(../img/${q.get('img')})`;
k.textContent=q.get('k');h.textContent=q.get('h');p.textContent=q.get('p');
</script></body></html>
